name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily check for a new Lichess puzzle database. The run stops after the
  # freshness job unless Lichess has published a new file.
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push cancels an older run; a scheduled run never cancels a push.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  # GitHub Pages serves this project at https://<owner>.github.io/<repo>/.
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.puzzles.outputs.key }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Find the current puzzle database version
        id: puzzles
        # Only the headers, never the file.
        run: |
          modified=$(curl -sfI -A 'Monachessimo build (github.com/Multi-Volt/Monachessimo)' https://database.lichess.org/lichess_db_puzzle.csv.zst | grep -i '^last-modified:' | cut -d' ' -f2- | tr -dc 'A-Za-z0-9')
          if [ -z "$modified" ]; then echo "Could not read the database version"; exit 1; fi
          echo "key=lichess-puzzles-${modified}" >> "$GITHUB_OUTPUT"
      - name: Look for this version in the cache
        id: cached
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/monachessimo
          key: ${{ steps.puzzles.outputs.key }}
          lookup-only: true
      - name: Decide whether to build
        id: decide
        # A scheduled run builds only when the cache has never seen this
        # version, which means the deployed site does not have it either.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.cached.outputs.cache-hit }}" = "true" ]; then
            echo "Puzzle database unchanged; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: freshness
    if: needs.freshness.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: ~/.cache/monachessimo
          key: ${{ needs.freshness.outputs.key }}
      - name: Download the puzzle database
        run: |
          f=~/.cache/monachessimo/lichess_db_puzzle.csv.zst
          mkdir -p ~/.cache/monachessimo
          [ -f "$f" ] || curl -sfL -A 'Monachessimo build (github.com/Multi-Volt/Monachessimo)' -o "$f" https://database.lichess.org/lichess_db_puzzle.csv.zst
      - name: Build puzzle shards
        run: node --import ./training/register.mjs scripts/build-puzzle-shards.ts --input ~/.cache/monachessimo/lichess_db_puzzle.csv.zst
      - name: Restore the coach model
        uses: actions/cache@v6
        with:
          path: ~/.cache/monachessimo-model
          key: coach-model-${{ hashFiles('scripts/coach-model.json') }}
      - name: Add the coach model
        run: scripts/fetch-coach-model.sh ~/.cache/monachessimo-model
      - name: Restore Maia-2
        uses: actions/cache@v6
        with:
          path: ~/.cache/monachessimo-maia2
          key: maia2-${{ hashFiles('scripts/maia2-model.json') }}
      - name: Add Maia-2
        run: scripts/fetch-maia2.sh ~/.cache/monachessimo-maia2
      - run: npx vite build
      - name: Build the offline bundle
        run: |
          npx vite build --mode offline
          mkdir -p dist/offline
          cp dist-offline/index.html dist/offline/monachessimo.html
      - name: Check shipped sizes
        # Cloudflare Pages rejects files over 25 MiB; GitHub Pages sites must stay under 1 GB.
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then echo "Files over 25 MiB:"; echo "$big"; exit 1; fi
          total=$(du -sb dist | cut -f1)
          echo "dist is $total bytes"
          if [ "$total" -gt 1000000000 ]; then echo "dist is over 1 GB"; exit 1; fi
      - name: Check size budgets
        run: node scripts/check-budget.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check timing budgets
        run: npx playwright test -c playwright.perf.config.ts ci.perf.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
